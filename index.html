<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0d2021">
  <title>Tidal Archipelago</title>
  <style>
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; }
    body { background: #0d2021; color: #eef1dc; font: 15px/1.5 system-ui, sans-serif; }
    body { display: grid; grid-template-rows: 38px minmax(0, 1fr); }
    .game-bar { display: flex; justify-content: space-between; align-items: center; padding: 0 12px;
      border-bottom: 1px solid #375450; }
    .game-bar a { color: #d7e9a8; font-size: 14px; text-underline-offset: 3px; }
    #unity-canvas { min-height: 0; display: block; width: 100%; height: 100%; background: #0d2021; outline: none; }
    #loading { position: fixed; inset: 38px 0 0; display: grid; place-items: center; padding: 22px;
      background: radial-gradient(ellipse at 40% 23%, #1c3938, #0d2021 64%); }
    #loading[hidden] { display: none; }
    #loading-card { max-width: 520px; width: 100%; padding: 30px; border: 1px solid #375450; border-radius: 13px; background: #142b2c; }
    h1 { margin: 0; font: 400 clamp(2.3rem, 7vw, 4rem)/1 Georgia, serif; letter-spacing: -.045em; }
    p { color: #aec2b7; }
    progress { display: block; width: 100%; accent-color: #d7e9a8; }
    #fullscreen { border: 1px solid #53716a;
      border-radius: 6px; color: #eff3df; padding: 4px 9px; background: #142b2cec; cursor: pointer; }
    #fullscreen:focus-visible { outline: 2px solid #d7e9a8; }
  </style>
</head>
<body>
  <header class="game-bar">
    <a href="https://alexz3221.github.io/Portfolio/#experiments">Back to AI experiments</a>
    <button type="button" id="fullscreen" hidden>Full screen</button>
  </header>
  <canvas id="unity-canvas" tabindex="0" aria-label="Tidal Archipelago Unity game"></canvas>
  <div id="loading" aria-live="polite">
    <div id="loading-card">
      <h1>Tidal Archipelago</h1>
      <p id="status">Loading the island simulation…</p>
      <progress id="progress" aria-label="Loading Unity game" max="1" value="0"></progress>
    </div>
  </div>
  <script>
    const buildUrl = "./Build";
    const canvas = document.querySelector("#unity-canvas");
    const loading = document.querySelector("#loading");
    const progress = document.querySelector("#progress");
    const status = document.querySelector("#status");
    const fullscreen = document.querySelector("#fullscreen");
    const config = {
      dataUrl: buildUrl + "/Web.data.unityweb",
      frameworkUrl: buildUrl + "/Web.framework.js.unityweb",
      codeUrl: buildUrl + "/Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "DefaultCompany",
      productName: "Tidal Archipelago",
      productVersion: "0.1.0",
      autoSyncPersistentDataPath: true,
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, 1.35),
    };
    const loader = document.createElement("script");
    loader.src = buildUrl + "/Web.loader.js";
    loader.onload = () => {
      createUnityInstance(canvas, config, value => { progress.value = value; }).then(game => {
        loading.hidden = true;
        fullscreen.hidden = false;
        fullscreen.addEventListener("click", () => game.SetFullscreen(1));
        canvas.focus();
      }).catch(error => {
        status.textContent = "The Unity build could not start. " + String(error);
        progress.hidden = true;
      });
    };
    loader.onerror = () => {
      status.textContent = "The Unity loader could not be downloaded. Reload the page to try again.";
      progress.hidden = true;
    };
    document.body.append(loader);
  </script>
</body>
</html>
